{% extends "account/_auth_layout.html" %}
{% block title %}登出{% endblock %}
{% block auth_content %}
  <h1 class="font-hand text-4xl font-bold">登出</h1>
  <p class="mt-2 text-soft">確定要登出目前的帳號嗎？</p>
  <form method="post" action="{% url 'account_logout' %}" class="mt-7">
    {% csrf_token %}
    <button type="submit" class="w-full rounded-xl bg-ink px-5 py-3 font-bold text-white hover:bg-student-dark">登出</button>
  </form>
  <a href="{% url 'core:home' %}" class="mt-4 block text-center text-sm text-soft underline">返回首頁</a>
{% endblock %}
